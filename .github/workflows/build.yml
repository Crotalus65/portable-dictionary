name: Build

# Every push and pull request is tested, published and packaged on a Windows runner;
# the archives are kept as a workflow artifact for 30 days. A GitHub release with the
# portable archive, the source archive and their SHA-256 checksums is published when a
# version tag is pushed (v1.0.5, matching APP_VERSION in tools/build.py), or when the
# workflow is run manually on main with "Publish a release" enabled, in which case the
# runner creates that tag itself.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a release: tag this commit as v<APP_VERSION> and publish the archives"
        type: boolean
        default: false
      replace_release:
        description: "Replace an existing release of this version: move its tag to this commit and republish the archives (use only for a packaging defect)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  # The lock files are refreshed on Windows instead of failing in NuGet's locked mode.
  RestoreLockedMode: false
  PYTHONUTF8: 1
  PYTHONIOENCODING: utf-8

jobs:
  build:
    name: Test, publish and package (win-x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install the pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read the application version
        id: version
        run: |
          mkdir -p release/logs
          version="$(python tools/release_notes.py --version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          { echo "Application version: $version"; dotnet --info; python --version; } 2>&1 | tee release/logs/00-tools.log

      - name: Check that a version tag matches the application version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "${{ steps.version.outputs.version }}" ]; then
            echo "Tag $GITHUB_REF_NAME does not match APP_VERSION ${{ steps.version.outputs.version }} in tools/build.py." >&2
            exit 1
          fi

      - name: Importer and data tests
        run: |
          set -o pipefail
          python tools/test_importer.py 2>&1 | tee release/logs/10-test-importer.log

      - name: .NET tests
        run: |
          set -o pipefail
          dotnet test tests/Dictionary.Tests/Dictionary.Tests.csproj -c Release 2>&1 | tee release/logs/20-dotnet-test.log

      - name: Publish the self-contained win-x64 build and create the archives
        run: |
          set -o pipefail
          python tools/build.py --skip-tests 2>&1 | tee release/logs/30-build.log

      - name: Write the release notes
        run: |
          python tools/release_notes.py > release/RELEASE_NOTES.md
          ls -l release
          cat release/*-SHA256SUMS.txt

      - name: Upload the archives as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Portable-Dictionary-${{ steps.version.outputs.version }}
          path: |
            release/Portable-Dictionary-*.zip
            release/*-SHA256SUMS.txt
            release/RELEASE_NOTES.md
            release/logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Create the version tag for a manually published release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if git fetch --quiet --depth=1 origin "refs/tags/$tag:refs/tags/$tag" 2>/dev/null; then
            existing="$(git rev-parse "$tag^{commit}")"
            if [ "$existing" = "$GITHUB_SHA" ]; then
              echo "Tag $tag already points at this commit."
              exit 0
            fi
            if [ "${{ inputs.replace_release }}" != "true" ]; then
              echo "Tag $tag already exists at $existing, not at this commit $GITHUB_SHA. Bump APP_VERSION, or re-run with 'Replace an existing release' enabled." >&2
              exit 1
            fi
            echo "Replacing release $tag: removing the release and tag at $existing."
            gh release delete "$tag" --cleanup-tag --yes || git push --delete origin "refs/tags/$tag"
            git tag -d "$tag"
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "Created tag $tag at $GITHUB_SHA."

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          assets=(release/Portable-Dictionary-*-Windows-x64.zip release/Portable-Dictionary-*-Source.zip release/*-SHA256SUMS.txt)
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists; replacing its assets and notes."
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --notes-file release/RELEASE_NOTES.md
          else
            gh release create "$tag" "${assets[@]}" \
              --verify-tag \
              --title "Portable Dictionary and Thesaurus ${{ steps.version.outputs.version }}" \
              --notes-file release/RELEASE_NOTES.md
          fi

      - name: Keep the step logs reachable when the build fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ci-failure-logs-run-${{ github.run_number }}" release/logs/*.log \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "CI failure logs, run ${{ github.run_number }} (safe to delete)" \
            --notes "Step logs of the failed workflow run ${{ github.run_id }}. This pre-release can be deleted once the failure is understood."
