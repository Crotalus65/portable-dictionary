name: Build Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  # The lock files were generated on Linux; let a Windows restore update them instead of failing in locked mode.
  RestoreLockedMode: false
  PYTHONUTF8: 1
  PYTHONIOENCODING: utf-8

jobs:
  build:
    name: Test, publish and package (win-x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install the pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tool versions
        run: |
          mkdir -p release/logs
          { dotnet --info; python --version; } 2>&1 | tee release/logs/00-tools.log

      - name: Importer and data tests
        run: |
          set -o pipefail
          python tools/test_importer.py 2>&1 | tee release/logs/10-test-importer.log

      - name: .NET tests
        run: |
          set -o pipefail
          dotnet test tests/Dictionary.Tests/Dictionary.Tests.csproj -c Release 2>&1 | tee release/logs/20-dotnet-test.log

      - name: Publish self-contained win-x64 build and create the release archives
        run: |
          set -o pipefail
          python tools/build.py --skip-tests 2>&1 | tee release/logs/30-build.log

      - name: Show release contents
        run: |
          ls -l release
          cat release/Portable-Dictionary-0.3-SHA256SUMS.txt

      - name: Publish the build logs as a pre-release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "logs-run-${{ github.run_number }}" release/logs/*.log \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Build logs for run ${{ github.run_number }}" \
            --notes "Step logs of workflow run ${{ github.run_id }} (job status: ${{ job.status }}). Safe to delete."

      - name: Publish the archives as a GitHub release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            release/Portable-Dictionary-0.3-Windows-x64.zip \
            release/Portable-Dictionary-0.3-Source.zip \
            release/Portable-Dictionary-0.3-SHA256SUMS.txt \
            --target "${{ github.sha }}" \
            --title "Portable Dictionary 0.3 with the lookup-shortcut fix (build ${{ github.run_number }})" \
            --notes "Built by GitHub Actions on windows-latest from commit ${{ github.sha }}. Portable-Dictionary-0.3-Windows-x64.zip contains the Dictionary-0.3 folder with Dictionary.exe; Portable-Dictionary-0.3-Source.zip is the matching source."

      - name: Upload release archives and logs as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Portable-Dictionary-0.3-release
          path: |
            release/Portable-Dictionary-0.3-Windows-x64.zip
            release/Portable-Dictionary-0.3-Source.zip
            release/Portable-Dictionary-0.3-SHA256SUMS.txt
            release/logs/
          if-no-files-found: warn
          retention-days: 30
